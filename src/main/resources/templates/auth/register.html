<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Register</title>
  <meta charset="UTF-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body class="bg-light">

<div class="container col-5 mt-5">
  <div class="card p-4">
    <h4 class="text-center mb-3">Register</h4>

    <div id="error" class="alert alert-danger d-none"></div>
    <div id="success" class="alert alert-success d-none"></div>

    <form onsubmit="doRegister(); return false;">
      <div class="mb-2">
        <label>Username</label>
        <input id="login" class="form-control" required>
      </div>

      <div class="mb-2">
        <label>Password</label>
        <input id="password" type="password" class="form-control" required>
      </div>

      <div class="mb-2">
        <label>First name</label>
        <input id="firstName" class="form-control">
      </div>

      <div class="mb-2">
        <label>Last name</label>
        <input id="lastName" class="form-control">
      </div>

      <div class="mb-2">
        <label>Area</label>
        <input id="area" class="form-control">
      </div>

      <button class="btn btn-success w-100 mt-2">
        Register
      </button>
    </form>

    <div class="text-center mt-3">
      <a th:href="@{/login}">Back to login</a>
    </div>
  </div>
</div>

<script>
  function doRegister() {
    fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        login: document.getElementById('login').value,
        password: document.getElementById('password').value,
        firstName: document.getElementById('firstName').value,
        lastName: document.getElementById('lastName').value,
        area: document.getElementById('area').value
      })
    })
            .then(r => {
              if (!r.ok) throw new Error("Register failed");
              document.getElementById('success').classList.remove('d-none');
              document.getElementById('success').innerText = 'Register success, please login';
              setTimeout(() => window.location.href = '/login', 1500);
            })
            .catch(e => {
              document.getElementById('error').classList.remove('d-none');
              document.getElementById('error').innerText = 'Register failed';
            });
  }
</script>

</body>
</html>
